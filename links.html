<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
:root {
  --bg: #0b0f19;
  --surface: #131b2e;
  --card: #182238;
  --accent-amber: #f59e0b;
  --accent-amber-glow: rgba(245, 158, 11, 0.35);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.06) 0px, transparent 50%);
  color: var(--text-main);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
  color: #fff;
  padding: 12px 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

header img {
  width: 180px;
  height: 90px;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  color: #ffffff;
}

.brand-fb-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #1877f2;
  color: #ffffff;
  box-shadow: 0 3px 10px rgba(24, 119, 242, 0.45);
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  text-decoration: none;
  flex-shrink: 0;
}
.brand-fb-icon svg { width: 18px; height: 18px; }

.header-links-block { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.header-links-title { font-size: 11.5px; font-weight: 700; color: #fbbf24; }
.fb-btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-fb, .btn-site-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
  backdrop-filter: blur(4px);
}
.btn-fb { background: rgba(24, 119, 242, 0.35); }
.btn-site-link { background: rgba(16, 185, 129, 0.35); }
.btn-fb svg, .btn-site-link svg { width: 14px; height: 14px; }

main {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.nav-tabs {
  margin-bottom: 24px;
}

.home-return-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
  color: #ffffff;
  text-decoration: none;
  padding: 10px 22px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 15px;
  box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
  transition: all 0.25s ease;
}
.home-return-btn:hover {
  background: linear-gradient(135deg, #b45309 0%, #92400e 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
}

/* Empty Project Canvas Container */
.project-canvas {
  background: var(--surface);
  border: 1.5px dashed rgba(245, 158, 11, 0.35);
  border-radius: 20px;
  padding: 60px 25px;
  min-height: 480px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

footer {
  background: rgba(15, 23, 42, 0.95);
  border-top: 1px solid var(--border);
  padding: 22px 20px;
  text-align: center;
  margin-top: auto;
}

footer p {
  margin: 0;
  color: var(--text-muted);
  font-size: 13.5px;
}

@media(max-width: 900px) {
  header { display: none !important; }
}
</style>

  <div class="header-links-block">
    <span class="header-links-title">📚 مراجع وروابط تهمكم:</span>
    <div class="fb-btn-group">

      <a class="btn-fb" href="https://www.facebook.com/d81em" target="_blank" rel="noopener noreferrer">Mourad Fodhil</a>

<main>
