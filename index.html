<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algeria’s Memories and Colors — الأرشيف</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C78NKFY91N"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-C78NKFY91N');
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
:root { --bg: #f8f9fa; --ink: #1a1a1a; --muted: #6c757d; --card: #ffffff; --accent: #d4af37; --accent-hover: #b5952f; --fb: #1877f2; --fb-hover: #166fe5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%); color: #fff; padding: 12px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; }
header .logo-container { display: flex; align-items: center; gap: 12px; }
header img { width: 280px; height: 140px; border-radius: 16px; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
header h1 { margin: 0; font-size: 26px; font-weight: 700; }
main { max-width: 1200px; margin: auto; padding: 30px 20px; }
.about-section { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; border-top: 4px solid var(--accent); }
.about-section h2 { margin-top: 0; color: var(--ink); }
.about-section p { color: var(--muted); font-size: 16px; line-height: 1.8; margin-bottom: 20px; }
.btn-fb { display: inline-flex; align-items: center; gap: 8px; background: var(--fb); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; transition: all 0.3s; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4); }
.btn-fb:hover { background: var(--fb-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(24, 119, 242, 0.6); }
.panel { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px; }
.searchline { display: flex; gap: 15px; margin-top: 15px; }
input { flex: 1; border: 2px solid #e9ecef; border-radius: 12px; padding: 16px 20px; font-size: 16px; font-family: 'Cairo', sans-serif; background: #f8f9fa; transition: all 0.3s; }
input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); }
#count { margin-top: 15px; color: var(--muted); font-weight: bold; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
.card { background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: all 0.3s; border: 1px solid #f1f3f5; }
.card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
.card img { display: block; width: 100%; height: 350px; object-fit: contain; background: #f8f9fa; border-bottom: 1px solid #f1f3f5; }
.body { padding: 20px; }
.body h2 { margin: 0 0 10px; font-size: 22px; color: var(--ink); }
.meta { color: var(--muted); line-height: 1.8; font-size: 15px; margin-bottom: 15px; }
.actions { display: flex; gap: 10px; }
.actions a { flex: 1; text-align: center; background: var(--ink); color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; transition: all 0.3s; font-size: 15px; }
.actions a:hover { background: #343a40; }
.actions a.download-btn { background: var(--accent); color: #fff; }
.actions a.download-btn:hover { background: var(--accent-hover); }
.empty { text-align: center; background: var(--card); border-radius: 20px; padding: 60px 20px; color: var(--muted); font-size: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 2px dashed #e9ecef; }
footer { text-align: center; color: var(--muted); padding: 30px; font-size: 15px; border-top: 1px solid #e9ecef; background: var(--card); margin-top: 40px; }

@media(max-width:600px){ header { justify-content: center; } .searchline{flex-direction:column} .card img{height:250px} header h1 { font-size: 18px; } }
</style>
</head>
<body>
<header>
  <div style="flex: 1;">
    <img src="images/header-image.jpg" alt="أرشيف الصور">
  </div>
  <div style="flex: 2; text-align: center;">
    <h1>Algeria’s Memories and Colors</h1>
  </div>
  <div style="flex: 1; display: flex; justify-content: flex-end;">
    <a class="btn-fb" href="https://www.facebook.com/groups/algerphoto" target="_blank" rel="noopener" style="padding: 8px 16px; font-size: 14px;">
      <svg style="width:18px;height:18px" viewBox="0 0 24 24"><path fill="currentColor" d="M22,12C22,6.48 17.52,2 12,2C6.48,2 2,6.48 2,12C2,16.84 5.44,20.87 10,21.8V15H7.54V12H10V9.82C10,7.42 11.43,6.11 13.62,6.11C14.67,6.11 15.77,6.3 15.77,6.3V8.67H14.56C13.37,8.67 13,9.41 13,10.18V12H15.68L15.25,15H13V21.8C17.56,20.87 22,16.84 22,12Z" /></svg>
      صفحتنا في الفيسبوك
    </a>
  </div>
</header>
<main>
<section class="panel">
<strong>🔎 البحث عن صور من ملف «المبحوث عنهم» خلال الفترة الاستعمارية.</strong>
<p style="color:var(--muted); font-size:14px; margin: 8px 0;">يرجى كتابة الاسم واللقب باللغة الفرنسية فقط.</p>
<div class="searchline">
  <input id="lastName" placeholder="اللقب (Nom)..." autocomplete="off">
  <input id="firstName" placeholder="الاسم (Prénom)..." autocomplete="off">
  <button id="showAllBtn" title="عرض جميع الأسماء" style="background:var(--accent); color:#fff; border:none; border-radius:12px; padding:16px 20px; font-family:'Cairo', sans-serif; cursor:pointer; font-weight:bold; font-size:16px; transition:0.3s; white-space:nowrap;">عرض كل الأسماء</button>
</div>
<div id="count"></div>
</section>
<section id="results" class="grid"></section>
</main>
<footer>
  <div style="margin-bottom:10px;">الأرشيف — يحتوي حاليًا على <span id="footerCount"></span> صورة.</div>
</footer>
<script src="data.js"></script><script>
const firstName=document.getElementById('firstName'),lastName=document.getElementById('lastName'),results=document.getElementById('results'),count=document.getElementById('count');
document.getElementById('footerCount').textContent = ARCHIVE.length;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  const f = firstName.value.trim().toLowerCase(), l = lastName.value.trim().toLowerCase();
  if (!f && !l) {
    count.textContent = '';
    results.innerHTML = '<div class="empty">الرجاء إدخال كلمة بحث لعرض الصور.</div>';
    return;
  }
  if ((f && f.length < 3) || (l && l.length < 3)) {
    count.textContent = '';
    results.innerHTML = '<div class="empty">الرجاء كتابة 3 أحرف على الأقل للبحث.</div>';
    return;
  }
  let a = [], message = '';
  if (f && l) {
    a = ARCHIVE.filter(x => Object.values(x).join(' ').toLowerCase().includes(f) && Object.values(x).join(' ').toLowerCase().includes(l));
    if (a.length === 0) {
      const byLastName = ARCHIVE.filter(x => Object.values(x).join(' ').toLowerCase().includes(l));
      if (byLastName.length > 0) {
        a = byLastName;
        message = '<div class="panel" style="background:#ffecd2; color:#856404; padding:15px; border-radius:12px; margin-bottom:20px;">للأسف هذا الاسم واللقب غير موجود، لكن هناك أسماء أخرى بنفس اللقب:</div>';
      }
    }
  } else if (l && !f) {
    a = ARCHIVE.filter(x => Object.values(x).join(' ').toLowerCase().includes(l));
  } else if (f && !l) {
    a = ARCHIVE.filter(x => Object.values(x).join(' ').toLowerCase().includes(f));
    count.textContent = `عرض ${a.length} من ${ARCHIVE.length} صورة`;
    if (a.length > 0) {
      let html = '<div class="panel"><h3>قائمة الأسماء المطابقة:</h3><ul style="line-height:2; list-style:none; padding:0;">';
      a.forEach((x, i) => {
        html += `<li>
          <a href="#" style="color:var(--ink); text-decoration:none; font-weight:bold; font-size:18px;" onclick="event.preventDefault(); const c=document.getElementById('card-${i}'); c.style.display=c.style.display==='none'?'block':'none';">
            🔻 ${esc(x.name)} ${x.arabic_name ? ' - ' + esc(x.arabic_name) : ''}
          </a>
          <div id="card-${i}" class="card" style="display:none; margin:15px 0; max-width:400px;">
            <img src="${esc(x.image)}" alt="${esc(x.name)}">
            <div class="body">
              <div class="actions">
                <a href="${esc(x.image)}" target="_blank" rel="noopener">👁️ عرض</a>
                <a href="${esc(x.image)}" download="${esc(x.name)}" class="download-btn">⬇️ تحميل</a>
              </div>
            </div>
          </div>
        </li>`;
      });
      results.innerHTML = html + '</ul></div>';
    } else {
      results.innerHTML = '<div class="empty">نتأسف لعدم وجود الاسم في هاته القائمة.</div>';
    }
    return;
  }
  
  count.textContent = `عرض ${a.length} من ${ARCHIVE.length} صورة`;
  let cardsHtml = a.length ? a.map(x => `<article class="card">
    <img src="${esc(x.image)}" alt="${esc(x.name)}">
    <div class="body">
      <h2>${esc(x.name)}</h2>
      <div class="meta">
        ${x.arabic_name ? esc(x.arabic_name)+'<br>' : ''}
        ${x.document ? 'الوثيقة: '+esc(x.document)+'<br>' : ''}
        ${x.year ? 'السنة: '+esc(x.year)+'<br>' : ''}
        ${x.place ? 'المكان: '+esc(x.place) : ''}
      </div>
      <div class="actions">
        <a href="${esc(x.image)}" target="_blank" rel="noopener">عرض</a>
        <a href="${esc(x.image)}" download="${esc(x.name)}" class="download-btn">تحميل</a>
      </div>
    </div>
  </article>`).join('') : '<div class="empty">نتأسف لعدم وجود الاسم في هاته القائمة.</div>';
  
  results.innerHTML = message + (a.length ? '<div class="grid">' + cardsHtml + '</div>' : cardsHtml);
}
const filterFn=function(){this.value=this.value.replace(/[^a-zA-Z\s\-']/g,'');render()};firstName.oninput=filterFn;lastName.oninput=filterFn;render();
document.getElementById('showAllBtn').onclick = () => {
  firstName.value = ''; lastName.value = '';
  count.textContent = `عرض ${ARCHIVE.length} من ${ARCHIVE.length} صورة`;
  let html = '<div class="panel"><h3>القائمة الكاملة للأسماء:</h3><ul style="line-height:2; list-style:none; padding:0;">';
  ARCHIVE.forEach((x, i) => {
    html += `<li>
      <a href="#" style="color:var(--ink); text-decoration:none; font-weight:bold; font-size:18px;" onclick="event.preventDefault(); const c=document.getElementById('all-card-${i}'); c.style.display=c.style.display==='none'?'block':'none';">
        🔻 ${esc(x.name)} ${x.arabic_name ? ' - ' + esc(x.arabic_name) : ''}
      </a>
      <div id="all-card-${i}" class="card" style="display:none; margin:15px 0; max-width:400px;">
        <img src="${esc(x.image)}" alt="${esc(x.name)}">
        <div class="body">
          <div class="actions">
            <a href="${esc(x.image)}" target="_blank" rel="noopener">👁️ عرض</a>
            <a href="${esc(x.image)}" download="${esc(x.name)}" class="download-btn">⬇️ تحميل</a>
          </div>
        </div>
      </div>
    </li>`;
  });
  results.innerHTML = html + '</ul></div>';
};
</script>
</body></html>
